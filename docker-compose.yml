services:
  # ────── Lumina Backend ──────
  backend:
    image: ghcr.io/molirain/cps_homework:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      # MQTT 连接地址 (你的 EMQX 服务器)
      - MQTT_HOST=${MQTT_HOST}
      # 是否走 TLS 加密端口 (true/false)
      - MQTT_TLS=${MQTT_TLS:-false}
      # MQTT 端口 (明文默认1883, TLS默认8883)
      - MQTT_PORT=${MQTT_PORT:-1883}
      # MQTT 账号密码
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # SQLite 数据存储路径
      - SQLITE_PATH=/data/lumina.db
      - SQLITE_DIR=/data
    volumes:
      # 将 SQLite 数据持久化到宿主机
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
